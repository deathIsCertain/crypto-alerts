name: India Stocks News Digest

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r stocks_bot/requirements.txt
      - name: Send daily India stocks digest email
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CI_STATE_FILE: stocks_news_state.json
        run: python -m stocks_bot.run_stocks_bot --send-digest
      - name: Send weekly PDF to channel (Sunday only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CI_STATE_FILE: stocks_news_state.json
        run: python -m stocks_bot.run_stocks_bot --send-weekly-pdf
      - name: Commit updated state (with retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks_news_state.json
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "chore: update stocks digest state"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "State pushed"
              exit 0
            fi
            echo "Push conflict, retrying ($i/3)"
            sleep 5
          done
          exit 1