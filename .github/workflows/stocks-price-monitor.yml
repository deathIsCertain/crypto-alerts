name: India Stocks Price Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r stocks_bot/requirements.txt
      - name: Check for major index moves
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CI_STATE_FILE: stocks_price_state.json
        run: python -m stocks_bot.run_stocks_bot --ci-check
      - name: Commit updated state (with retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks_price_state.json
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "chore: update stocks price monitor state"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "State pushed"
              exit 0
            fi
            echo "Push conflict, retrying ($i/3)"
            sleep 5
          done
          exit 1